spring:
  application:
    name: spot-your-slot-backend
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

debug: false
trace: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}

spotyourslot:
  security:
    allowed-origin: ${ALLOWED_ORIGIN:http://localhost:5173}
    trusted-proxy: ${TRUSTED_PROXY:false}
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
